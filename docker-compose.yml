version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nivara_server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
    environment:
      - FLASK_ENV=development

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: nivara_client
    ports:
      - "3000:80"
    depends_on:
      - server
